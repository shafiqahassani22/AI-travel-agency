<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <link rel="stylesheet" href="./css/signup.css">
</head>
<body>

    <div class="auth-card">

      <div class="auth-form">
        <div class="auth-top">
          <a href="./index.html" class="go-home">
            <i class="fa-solid fa-arrow-left"></i> Go Home
          </a>
          <button type="button" id="dark_toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
        <h2 class="auth-brand">Smart <span>Travels</span></h2>
        <h1>Create account</h1>
        <p class="auth-sub">Join us and start planning your next adventure.</p>

        <form id="signup-form" action="#" method="post">
          <div class="field">
            <label for="name">Full name</label>
            <div class="input-box">
              <i class="fa-regular fa-user"></i>
              <input id="name" type="text" placeholder="Shafiqa Mateen" required>
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="input-box">
              <i class="fa-regular fa-envelope"></i>
              <input id="email" type="email" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock"></i>
              <input id="password" type="password" placeholder="Create a password" required>
            </div>
          </div>

          <div class="field">
            <label for="confirm">Confirm password</label>
            <div class="input-box">
              <i class="fa-solid fa-lock"></i>
              <input id="confirm" type="password" placeholder="Repeat your password" required>
            </div>
          </div>

          <div class="auth-row">
            <label class="remember"><input id="terms" type="checkbox"> I agree to the terms</label>
          </div>

          <p id="signup-error" class="signup-error"></p>

          <button id="signup-btn" type="submit" class="auth-btn">
            <i class="fa-solid fa-user-plus"></i> Sign up
          </button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="./login.html">Login</a>
        </p>
      </div>

      <div class="auth-image">
        <img src="./images/plane-boarding.jpg" alt="Beautiful travel destination">
        <div class="auth-overlay">
          <h3>Your journey starts from here</h3>
        </div>
      </div>

    </div>

    <script src="./javascript/loginAndSignup.js"></script>
    <script src="./javascript/dark.js"></script>

</body>
</html>
